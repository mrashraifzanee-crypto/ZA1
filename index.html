    <!-- Polyfill/setter for window.fetch to allow extension interceptors to assign fetch without throwing -->
    <script>
      (function() {
        try {
          var _rawFetch = window.fetch ? window.fetch.bind(window) : null;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _rawFetch;
            },
            set: function(fn) {
              _rawFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {}

        window.addEventListener('error', function(event) {
          if (
            (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
            (event.message && event.message.indexOf('Cannot set property fetch') !== -1)
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
